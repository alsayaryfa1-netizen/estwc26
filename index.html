<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EST WC26 Prediction Game</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--bg2:#111827;--bg3:#1a2235;--gold:#f5c842;--gold2:#e0a800;--red:#e63946;--green:#2ec46a;--blue:#3b82f6;--text:#e8eaf0;--muted:#8892a4;--border:#1e2d47;--card:#141d2e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;min-height:100vh}
header{background:linear-gradient(135deg,#0d1526,#1a2a4a);border-bottom:2px solid var(--gold);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);letter-spacing:2px;text-shadow:0 0 20px rgba(245,200,66,.4)}
.logo span{color:#fff}
.header-right{display:flex;align-items:center;gap:8px}
.user-badge{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--gold);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px}
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;border-radius:6px;border:none;cursor:pointer;transition:all .2s}
.btn-gold{background:var(--gold);color:#0a0e1a}.btn-gold:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}.btn-outline:hover{background:rgba(245,200,66,.1)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#c0313d}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-full{width:100%}
nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav-tab{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:13px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.nav-tab:hover{color:var(--text)}.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
main{max-width:920px;margin:0 auto;padding:22px 14px 80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#fff;letter-spacing:3px;margin-bottom:4px}
.section-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
#loginScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:#04080f}

#loginScreen::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(4,8,15,0.55) 0%,rgba(4,8,15,0.45) 30%,rgba(4,8,15,0.65) 65%,rgba(4,8,15,0.95) 100%)}
#loginScreen>*{position:relative;z-index:2}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:56px;color:var(--gold);letter-spacing:6px;text-shadow:0 0 40px rgba(245,200,66,.7),0 2px 20px rgba(0,0,0,0.9);text-align:center;line-height:1;margin-bottom:6px}
.login-logo span{color:#fff;text-shadow:0 2px 20px rgba(0,0,0,0.9)}
.login-sub{color:rgba(255,255,255,0.7);font-size:13px;letter-spacing:4px;text-transform:uppercase;text-align:center;margin-bottom:10px;text-shadow:0 1px 8px rgba(0,0,0,0.8)}
.login-tagline{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);letter-spacing:5px;text-align:center;margin-bottom:28px;text-shadow:0 0 30px rgba(245,200,66,0.6)}
.login-box{background:rgba(20,29,46,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(245,200,66,0.2);border-radius:18px;padding:28px;width:100%;max-width:350px;box-shadow:0 25px 80px rgba(0,0,0,.8)}
.form-group{margin-bottom:13px}
.form-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.form-input{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--gold)}
select.form-input option{background:var(--bg3)}
.error-msg{color:var(--red);font-size:13px;margin-top:7px}
.success-msg{color:var(--green);font-size:13px;margin-top:7px}
.match-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.match-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:4px}
.match-group-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(245,200,66,.1);padding:2px 8px;border-radius:4px}
.match-date{color:var(--muted);font-size:11px}
.match-venue{color:var(--muted);font-size:10px;font-style:italic}
.match-teams{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.team-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;flex:1;text-align:center}
.vs-badge{font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 6px;flex-shrink:0}
.prediction-btns{display:flex;gap:6px}
.pred-btn{flex:1;padding:8px 3px;border-radius:7px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;text-align:center}
.pred-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pred-btn.sel-home{background:rgba(46,196,106,.15);border-color:var(--green);color:var(--green)}
.pred-btn.sel-draw{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue)}
.pred-btn.sel-away{background:rgba(230,57,70,.15);border-color:var(--red);color:var(--red)}
.pred-btn:disabled{opacity:.4;cursor:not-allowed}
.deadline-badge{font-size:10px;color:var(--muted);margin-top:7px;text-align:right}
.deadline-badge.locked{color:var(--red)}
.result-badge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.res-correct{background:rgba(46,196,106,.2);color:var(--green);border:1px solid var(--green)}
.res-wrong{background:rgba(230,57,70,.15);color:var(--red);border:1px solid var(--red)}
.res-pending{background:rgba(245,200,66,.1);color:var(--gold);border:1px solid var(--gold)}
.lb-row{display:flex;align-items:center;padding:11px 13px;border-radius:8px;margin-bottom:7px;background:var(--bg3);border:1px solid var(--border);gap:11px;transition:transform .15s;cursor:pointer}
.lb-row:hover{transform:translateX(3px)}
.rank-num{font-family:'Bebas Neue',sans-serif;font-size:20px;width:28px;text-align:center;color:var(--muted);flex-shrink:0}
.rank-1 .rank-num{color:var(--gold)}.rank-2 .rank-num{color:#c0c0c0}.rank-3 .rank-num{color:#cd7f32}
.rank-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;flex:1}
.rank-points{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold)}
.rank-pts-label{font-size:10px;color:var(--muted);font-family:'Barlow Condensed',sans-serif}
.group-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.group-tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.group-tab:hover{border-color:var(--gold);color:var(--gold)}
.group-tab.active{background:var(--gold);color:#0a0e1a;border-color:var(--gold)}
.trophy-box{background:linear-gradient(135deg,#1a2a1a,#1a2235);border:1.5px solid rgba(245,200,66,.3);border-radius:12px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.trophy-box::before{content:'&#127942;';position:absolute;right:-10px;top:-10px;font-size:70px;opacity:.07}
.trophy-title{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.score-input{width:50px;text-align:center;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:20px;padding:4px 5px;outline:none}
.score-input:focus{border-color:var(--gold)}
.score-dash{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted)}
.result-input-area{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:84vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px;margin-bottom:18px}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;margin-top:-3px}
.badge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.badge-green{background:rgba(46,196,106,.15);color:var(--green);border:1px solid rgba(46,196,106,.3)}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.empty-state{text-align:center;color:var(--muted);padding:36px 20px;font-size:14px}

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(pwd) {
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const hash = await sha256(pwd + salt);
  return { hash, salt };
}
async function verifyPassword(pwd, salt, storedHash) {
  return await sha256(pwd + salt) === storedHash;
}

// ── Firestore helpers ──
async function fsSet(path, data) { await setDoc(doc(db, ...path.split('/')), data, {merge:true}); }
async function fsGet(path) { const s=await getDoc(doc(db,...path.split('/'))); return s.exists()?s.data():null; }
async function fsDelete(path) { await deleteDoc(doc(db,...path.split('/'))); }
async function fsCollection(col) { const s=await getDocs(collection(db,col)); const o={}; s.forEach(d=>{o[d.id]=d.data();}); return o; }

// ── Listeners ──
function startListeners() {
  onSnapshot(collection(db,'matches'), snap=>{ snap.forEach(d=>{ const i=MATCHES.findIndex(m=>m.id===parseInt(d.id)); if(i!==-1)Object.assign(MATCHES[i],d.data()); }); if(ACTIVE_TAB==='predictions')renderMatchList(); if(ACTIVE_TAB==='results')renderResultList(); if(ACTIVE_TAB==='leaderboard')renderLeaderboard(); });
  onSnapshot(collection(db,'predictions'), snap=>{ snap.forEach(d=>{PREDICTIONS[d.id]=d.data();}); if(ACTIVE_TAB==='leaderboard')renderLeaderboard(); if(ACTIVE_TAB==='predictions'&&CU)renderMatchList(); });
  onSnapshot(collection(db,'trophyPicks'), snap=>{ snap.forEach(d=>{TROPHY_PICKS[d.id]=d.data();}); if(ACTIVE_TAB==='trophy')renderTrophy(); });
  onSnapshot(collection(db,'users'), snap=>{ snap.forEach(d=>{USERS[d.id]=d.data();}); if(ACTIVE_TAB==='admin')renderAdmin(); if(ACTIVE_TAB==='leaderboard')renderLeaderboard(); });
  onSnapshot(doc(db,'config','trophyResults'), snap=>{ if(snap.exists())TROPHY_RESULTS=snap.data(); if(ACTIVE_TAB==='leaderboard')renderLeaderboard(); });
  onSnapshot(doc(db,'config','rankSnapshot'), snap=>{ if(snap.exists())RANK_SNAPSHOT=snap.data(); if(ACTIVE_TAB==='leaderboard')renderLeaderboard(); });
  onSnapshot(doc(db,'config','manualPoints'), snap=>{ if(snap.exists())MANUAL_POINTS=snap.data(); if(ACTIVE_TAB==='leaderboard')renderLeaderboard(); });
}

// ── Bootstrap ──
async function bootstrap() {
  const st = document.querySelector('.spinner-text');
  try {
    const timeout = new Promise((_,r)=>setTimeout(()=>r(new Error('TIMEOUT')),12000));
    st.textContent='Loading users...'; USERS=await Promise.race([fsCollection('users'),timeout]);
    st.textContent='Loading predictions...'; PREDICTIONS=await Promise.race([fsCollection('predictions'),timeout]);
    st.textContent='Loading trophy picks...'; TROPHY_PICKS=await Promise.race([fsCollection('trophyPicks'),timeout]);
    st.textContent='Loading match data...';
    const mDocs=await Promise.race([fsCollection('matches'),timeout]);
    Object.entries(mDocs).forEach(([id,data])=>{ const i=MATCHES.findIndex(m=>m.id===parseInt(id)); if(i!==-1)Object.assign(MATCHES[i],data); });
    st.textContent='Loading trophy results...';
    const trDoc=await Promise.race([fsGet('config/trophyResults'),timeout]);
    if(trDoc)TROPHY_RESULTS=trDoc;
    st.textContent='Loading rank history...';
    const snapDoc=await Promise.race([fsGet('config/rankSnapshot'),timeout]);
    if(snapDoc)RANK_SNAPSHOT=snapDoc;
    const mpDoc=await Promise.race([fsGet('config/manualPoints'),timeout]);
    if(mpDoc)MANUAL_POINTS=mpDoc;
    st.textContent='Setting up admin...';
    const existingAdmin=USERS[ADMIN_USER]||Object.values(USERS).find(function(u){return u.role==='admin';});
    if(!existingAdmin){
      const {hash,salt}=await hashPassword(ADMIN_PASS);
      await fsSet('users/'+ADMIN_USER,{username:ADMIN_USER,passwordHash:hash,salt,role:'admin',createdAt:Date.now()});
      USERS[ADMIN_USER]={username:ADMIN_USER,passwordHash:hash,salt,role:'admin'};
    } else if(existingAdmin&&!USERS[ADMIN_USER]){
      USERS[existingAdmin.username]=existingAdmin;
    }
    startListeners();
    document.getElementById('spinnerOverlay').style.display='none';
    document.getElementById('loginScreen').classList.remove('hidden');
  } catch(e) {
    console.error('Bootstrap error:',e);
    if(e.message==='TIMEOUT') showError('Firebase took too long.<br>Check your internet connection and Firestore rules.');
    else if(e.code==='permission-denied'||(e.message&&e.message.includes('permission'))) showError('Firebase blocked the request.<br>Go to Firestore Database &rarr; Rules and publish: allow read, write: if true;');
    else showError('Error: '+(e.message||e.code||'Unknown'));
  }
}

// ── Helpers ──
function isLocked(m){return new Date()>=new Date(new Date(m.dt).getTime()-45*60*1000);}
function isTrophyLocked(){return new Date()>=TROPHY_LOCK;}
function fmtDate(dt){
  const d=new Date(dt);
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' &middot; '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/New_York',hour12:true})+' ET';
}
function fmtDeadline(m){
  const d=new Date(new Date(m.dt).getTime()-45*60*1000);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/New_York',hour12:true})+' ET';
}
function migratePick(val){return val==='Other'?'Bruno Fernandes (Portugal)':val;}

function calcPoints(username) {
  const preds=PREDICTIONS[username]||{};
  let pts=0,details=[];
  MATCHES.forEach(function(m){
    if(m.result&&preds[m.id]){
      const ok=preds[m.id]===m.result;
      const matchPts=m.type==='knockout'?5:3;
      if(ok)pts+=matchPts;
      details.push({match:m,pred:preds[m.id],correct:ok,pts:matchPts});
    }
  });
  details.sort(function(a,b){return new Date(a.match.dt)-new Date(b.match.dt);});
  const rawTp=TROPHY_PICKS[username]||{};
  const tp={scorer:migratePick(rawTp.scorer),winner:rawTp.winner,mvp:migratePick(rawTp.mvp)};
  let bonusDetails=[];
  if(TROPHY_RESULTS.topScorer&&tp.scorer){const ok=tp.scorer===TROPHY_RESULTS.topScorer;if(ok)pts+=10;bonusDetails.push({label:'&#9917; Top Goalscorer',pick:tp.scorer,correct:ok,pts:10});}
  if(TROPHY_RESULTS.winner&&tp.winner){const ok=tp.winner===TROPHY_RESULTS.winner;if(ok)pts+=15;bonusDetails.push({label:'&#127941; Tournament Winner',pick:tp.winner,correct:ok,pts:15});}
  if(TROPHY_RESULTS.mvp&&tp.mvp){const ok=tp.mvp===TROPHY_RESULTS.mvp;if(ok)pts+=10;bonusDetails.push({label:'&#127775; MVP',pick:tp.mvp,correct:ok,pts:10});}
  const manual=(MANUAL_POINTS[username])||0;
  return{total:pts+manual,matchPts:pts,manualPts:manual,details:details,bonusDetails:bonusDetails};
}

// ── saveRankSnapshot ──
async function saveRankSnapshot(){
  const players=Object.values(USERS);
  const ranked=players.map(function(u){return{username:u.username,total:calcPoints(u.username).total};}).sort(function(a,b){return b.total-a.total;});
  const snapshot={};
  ranked.forEach(function(u,i){snapshot[u.username]=i+1;});
  await fsSet('config/rankSnapshot',snapshot);
  RANK_SNAPSHOT=snapshot;
}

window.doLogin=async function(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const err=document.getElementById('loginError');
  err.classList.add('hidden');
  const userData=USERS[u]||USERS[Object.keys(USERS).find(function(k){return k.toLowerCase()===u.toLowerCase();})];
  if(!userData){err.textContent='Invalid username or password.';err.classList.remove('hidden');return;}
  const ok=await verifyPassword(p,userData.salt,userData.passwordHash);
  if(!ok){
    if(u.toLowerCase()===ADMIN_USER.toLowerCase()&&p===ADMIN_PASS){
      const {hash,salt}=await hashPassword(p);
      await fsSet('users/'+ADMIN_USER,{passwordHash:hash,salt:salt});
      userData.passwordHash=hash;userData.salt=salt;USERS[u]=userData;
    } else {
      err.textContent='Invalid username or password.';err.classList.remove('hidden');return;
    }
  }
  CU=userData;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('headerUser').textContent=userData.username.toUpperCase()+(userData.role==='admin'?' ★':'');
  renderNav();showTab('predictions');
};

window.doRegister=async function(){
  const u=document.getElementById('regUser').value.trim();
  const p=document.getElementById('regPass').value;
  const p2=document.getElementById('regPass2').value;
  const err=document.getElementById('regError');
  const suc=document.getElementById('regSuccess');
  err.classList.add('hidden');suc.classList.add('hidden');
  if(!u||u.length<2){err.textContent='Username must be at least 2 characters.';err.classList.remove('hidden');return;}
  if(!p||p.length<4){err.textContent='Password must be at least 4 characters.';err.classList.remove('hidden');return;}
  if(p!==p2){err.textContent='Passwords do not match.';err.classList.remove('hidden');return;}
  if(USERS[u]||Object.keys(USERS).find(function(k){return k.toLowerCase()===u.toLowerCase();})){err.textContent='Username already taken.';err.classList.remove('hidden');return;}
  if(u.toLowerCase()===ADMIN_USER.toLowerCase()){err.textContent='That username is not available.';err.classList.remove('hidden');return;}
  const {hash,salt}=await hashPassword(p);
  const newUser={username:u,passwordHash:hash,salt,role:'player',createdAt:Date.now()};
  await fsSet('users/'+u,newUser);
  USERS[u]=newUser;
  document.getElementById('regUser').value='';document.getElementById('regPass').value='';document.getElementById('regPass2').value='';
  suc.textContent='\u2713 Account created! You can now sign in.';suc.classList.remove('hidden');

};

window.saveTrophy=async function(){
  if(isTrophyLocked())return;
  const scorer=document.getElementById('scorerPick').value;
  const winner=document.getElementById('winnerPick').value;
  const mvp=document.getElementById('mvpPick').value;
  const msg=document.getElementById('trophyMsg');
  if(!scorer||!winner||!mvp){msg.textContent='Please select all three picks.';msg.style.color='var(--red)';msg.classList.remove('hidden');return;}
  await fsSet('trophyPicks/'+CU.username,{scorer:scorer,winner:winner,mvp:mvp,updatedAt:Date.now()});
  TROPHY_PICKS[CU.username]={scorer:scorer,winner:winner,mvp:mvp};
  msg.textContent='&#10003; All picks saved!';msg.style.color='var(--green)';msg.classList.remove('hidden');
  setTimeout(function(){msg.classList.add('hidden');},3000);
};

// ── Predictions ──
function renderPredictions(){
  const stages=[...new Set(MATCHES.map(function(m){return m.stage;}))].sort(function(a,b){return STAGES_ORDER.indexOf(a)-STAGES_ORDER.indexOf(b);});
  let html='<div class="section-title">&#9917; MATCH PREDICTIONS</div>';
  html+='<div class="section-sub">Pick a result for each match. Locked 45 mins before kick-off.</div>';
  html+='<div class="group-tabs">'+stages.map(function(s){return '<button class="group-tab '+(PRED_FILTER===s?'active':'')+'" onclick="window.filterPred(\''+s+'\')">' + s + '</button>';}).join('')+'</div>';
  html+='<div id="matchList"></div>';
  document.getElementById('mainContent').innerHTML=html;

}

window.filterPred=function(s){
  PRED_FILTER=s;
  document.querySelectorAll('.group-tab').forEach(function(el){el.classList.toggle('active',el.textContent.trim()===s);});
  renderMatchList();
};

function renderMatchList(){
  const preds=PREDICTIONS[CU.username]||{};
  let matches;
  if(PRED_FILTER==='All Matches'){matches=[...MATCHES].sort(function(a,b){return new Date(a.dt)-new Date(b.dt);});}
  else{matches=MATCHES.filter(function(m){return m.stage===PRED_FILTER;});}
  const c=document.getElementById('matchList');if(!c)return;
  if(!matches.length){c.innerHTML='<div class="empty-state">No matches in this stage yet.</div>';return;}
  const allSorted=[...MATCHES].sort(function(a,b){return new Date(a.dt)-new Date(b.dt);});
  const cards=matches.map(function(m){
    const locked=isLocked(m);
    const pred=preds[m.id];
    const ko=m.type==='knockout';
    const sortedNum=allSorted.indexOf(m)+1;
    let correctness='';
    if(m.result&&pred){correctness=pred===m.result?'<span class="result-badge res-correct">&#10003; +'+(ko?5:3)+' pts</span>':'<span class="result-badge res-wrong">&#10007; 0 pts</span>';}
    else if(locked&&!m.result&&pred){correctness='<span class="result-badge res-pending">Awaiting result</span>';}
    const score=m.result?'<div style="font-family:Bebas Neue,sans-serif;font-size:22px;color:var(--gold);text-align:center;margin:-2px 0 8px">'+m.homeScore+' - '+m.awayScore+'</div>':'';
    const hC=pred==='home'?'pred-btn sel-home':'pred-btn';
    const dC=pred==='draw'?'pred-btn sel-draw':'pred-btn';
    const aC=pred==='away'?'pred-btn sel-away':'pred-btn';
    const dis=locked?' disabled':'';
    let btns='';
    const mid=m.id;
    if(ko){
      btns='<div class="prediction-btns">'
        +'<button class="'+hC+'" data-mid="'+mid+'" data-val="home" onclick="window.setPred(+this.dataset.mid,this.dataset.val)"'+dis+'>'+flag(m.h)+' '+m.h+' WIN</button>'
        +'<button class="'+aC+'" data-mid="'+mid+'" data-val="away" onclick="window.setPred(+this.dataset.mid,this.dataset.val)"'+dis+'>'+flag(m.a)+' '+m.a+' WIN</button>'
        +'</div>';
    }else{
      btns='<div class="prediction-btns">'
        +'<button class="'+hC+'" data-mid="'+mid+'" data-val="home" onclick="window.setPred(+this.dataset.mid,this.dataset.val)"'+dis+'>'+flag(m.h)+' '+m.h+'</button>'
        +'<button class="'+dC+'" data-mid="'+mid+'" data-val="draw" onclick="window.setPred(+this.dataset.mid,this.dataset.val)"'+dis+'>DRAW</button>'
        +'<button class="'+aC+'" data-mid="'+mid+'" data-val="away" onclick="window.setPred(+this.dataset.mid,this.dataset.val)"'+dis+'>'+flag(m.a)+' '+m.a+'</button>'
        +'</div>';
    }
    let community='';
    if(locked){
      const allPlayers=Object.values(USERS);
      const homeU=[],drawU=[],awayU=[];
      allPlayers.forEach(function(u){const up=(PREDICTIONS[u.username]||{})[m.id];if(up==='home')homeU.push(u.username);else if(up==='draw')drawU.push(u.username);else if(up==='away')awayU.push(u.username);});
      const total=homeU.length+drawU.length+awayU.length;
      if(total>0){
        const hp=Math.round(homeU.length/total*100);
        const dp=Math.round(drawU.length/total*100);
        const ap=Math.round(awayU.length/total*100);
        community+='<div style="margin-top:10px;background:rgba(10,14,26,0.6);border:1px solid var(--border);border-radius:8px;padding:10px">';
        community+='<div style="font-family:Barlow Condensed,sans-serif;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px">&#128101; Community Picks ('+total+')</div>';
        community+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;margin-bottom:3px"><span style="color:var(--green)">'+flag(m.h)+' '+m.h+(ko?' WIN':'')+'</span><span style="color:var(--green)">'+hp+'% ('+homeU.length+')</span></div><div style="background:var(--border);border-radius:4px;height:5px"><div style="background:var(--green);height:5px;border-radius:4px;width:'+hp+'%"></div></div>'+(homeU.length?'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+homeU.join(', ')+'</div>':'')+'</div>';
        if(!ko){community+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;margin-bottom:3px"><span style="color:var(--blue)">DRAW</span><span style="color:var(--blue)">'+dp+'% ('+drawU.length+')</span></div><div style="background:var(--border);border-radius:4px;height:5px"><div style="background:var(--blue);height:5px;border-radius:4px;width:'+dp+'%"></div></div>'+(drawU.length?'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+drawU.join(', ')+'</div>':'')+'</div>';}
        community+='<div><div style="display:flex;justify-content:space-between;font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;margin-bottom:3px"><span style="color:var(--red)">'+flag(m.a)+' '+m.a+(ko?' WIN':'')+'</span><span style="color:var(--red)">'+ap+'% ('+awayU.length+')</span></div><div style="background:var(--border);border-radius:4px;height:5px"><div style="background:var(--red);height:5px;border-radius:4px;width:'+ap+'%"></div></div>'+(awayU.length?'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+awayU.join(', ')+'</div>':'')+'</div>';
        community+='</div>';
      }
    }
    const stageLabel=(ko&&m.label)?m.label:m.stage;
    const stageClass=ko?'tag-knockout':'match-group-label';
    const deadlineStr=locked?'&#128274; Locked':'&#9200; Deadline: '+fmtDeadline(m);
    return '<div class="match-card">'
      +'<div class="match-header">'
        +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
          +'<span style="font-family:Bebas Neue,sans-serif;font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 7px;letter-spacing:1px">M'+sortedNum+'</span>'
          +'<span class="'+stageClass+'">'+stageLabel+'</span>'
        +'</div>'
        +'<div style="text-align:right"><div class="match-date">'+fmtDate(m.dt)+'</div><div class="match-venue">'+m.venue+'</div></div>'
      +'</div>'
      +score
      +'<div class="match-teams">'
        +'<div class="team-name">'+flag(m.h)+' '+m.h+'</div>'
        +'<div class="vs-badge">VS</div>'
        +'<div class="team-name">'+m.a+' '+flag(m.a)+'</div>'
      +'</div>'
      +btns
      +'<div class="flex justify-between items-center mt8">'
        +'<div>'+correctness+'</div>'
        +'<div class="deadline-badge '+(locked?'locked':'')+'">'+deadlineStr+'</div>'
      +'</div>'
      +community
    +'</div>';
  });
  c.innerHTML=cards.join('');
}

window.setPred=async function(matchId,val){
  const m=MATCHES.find(function(x){return x.id===matchId;});
  if(!m||isLocked(m))return;
  if(!PREDICTIONS[CU.username])PREDICTIONS[CU.username]={};
  PREDICTIONS[CU.username][matchId]=val;
  await fsSet('predictions/'+CU.username,{[matchId]:val});
  renderMatchList();
};

  const players=Object.values(USERS);

  if(!ranked.length){html+='<div class="empty-state">No players yet.</div>';}
  else{
    ranked.forEach(function(u,i){
      const cls=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
      const medal=i===0?'&#127945;':i===1?'&#129352;':i===2?'&#129353;':'';
      const currentRank=i+1;
      const prevRank=RANK_SNAPSHOT[u.username];
      let arrow='';

        const diff=prevRank-currentRank;

        arrow='<span style="color:var(--gold);font-family:Barlow Condensed,sans-serif;font-weight:700;font-size:11px;margin-left:6px">NEW</span>';
      }
      html+='<div class="lb-row '+cls+'" data-un="'+u.username+'" onclick="window.showUserDetail(this.dataset.un)">'
        +'<div class="rank-num">'+(medal||currentRank)+'</div>'

    +'<div class="detail-row"><span>Correct MVP of the tournament</span><span class="detail-pts">+10 &#127775;</span></div>'
  +'</div></div>';
  document.getElementById('mainContent').innerHTML=html;
}

function renderResultList(){
  let matches;
  if(RES_FILTER==='All Matches'){matches=[...MATCHES].sort(function(a,b){return new Date(a.dt)-new Date(b.dt);});}
  else{matches=MATCHES.filter(function(m){return m.stage===RES_FILTER;}).sort(function(a,b){return new Date(a.dt)-new Date(b.dt);});}
  const c=document.getElementById('resultList');if(!c)return;
  if(!matches.length){c.innerHTML='<div class="empty-state">No matches.</div>';return;}
  const allSorted=[...MATCHES].sort(function(a,b){return new Date(a.dt)-new Date(b.dt);});
  c.innerHTML=matches.map(function(m){
    const ko=m.type==='knockout';
    const hasResult=m.result!==null;
    const sortedNum=allSorted.indexOf(m)+1;
    let rSection='';
    if(ko){
      const rid=m.id;
      rSection='<div class="result-input-area">'
        +'<button class="pred-btn '+(m.result==='home'?'sel-home':'')+'" style="flex:1;padding:9px" data-id="'+rid+'" data-r="home" onclick="window.setKOResult(+this.dataset.id,this.dataset.r)">'+flag(m.h)+' '+m.h+' WIN</button>'
        +'<button class="pred-btn '+(m.result==='away'?'sel-away':'')+'" style="flex:1;padding:9px" data-id="'+rid+'" data-r="away" onclick="window.setKOResult(+this.dataset.id,this.dataset.r)">'+flag(m.a)+' '+m.a+' WIN</button>'
        +(hasResult?'<button class="btn btn-outline btn-sm" data-id="'+rid+'" onclick="window.clearResult(+this.dataset.id)">CLEAR</button>':'')
        +'</div>'
        +'<div class="mt8"><button class="btn btn-outline btn-sm" data-id="'+rid+'" onclick="window.editKOTeams(+this.dataset.id)">Set Teams</button></div>';
    }else{
      rSection='<div class="result-input-area">'
        +'<input class="score-input" type="number" min="0" max="30" id="hs-'+rid+'" value="'+(m.homeScore!==null?m.homeScore:'')+'" placeholder="0">'
        +'<span class="score-dash">&mdash;</span>'
        +'<input class="score-input" type="number" min="0" max="30" id="as-'+rid+'" value="'+(m.awayScore!==null?m.awayScore:'')+'" placeholder="0">'
        +'<button class="btn btn-gold btn-sm" data-id="'+rid+'" onclick="window.submitResult(+this.dataset.id)">SAVE</button>'
        +(hasResult?'<button class="btn btn-outline btn-sm" data-id="'+rid+'" onclick="window.clearResult(+this.dataset.id)">CLEAR</button>':'')
        +'</div>';
    }
    return '<div class="match-card">'
      +'<div class="match-header">'
        +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
          +'<span style="font-family:Bebas Neue,sans-serif;font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 7px;letter-spacing:1px">M'+sortedNum+'</span>'
          +'<span class="'+(ko?'tag-knockout':'match-group-label')+'">'+(ko&&m.label?m.label:m.stage)+'</span>'
        +'</div>'
        +'<div style="text-align:right"><div class="match-date">'+fmtDate(m.dt)+'</div>'+(hasResult?'<span class="badge badge-green">&#10003; Saved</span>':'')+'</div>'
      +'</div>'
      +'<div class="match-teams"><div class="team-name">'+flag(m.h)+' '+m.h+'</div><div class="vs-badge">VS</div><div class="team-name">'+m.a+' '+flag(m.a)+'</div></div>'
      +rSection
    +'</div>';
  }).join('');
}

window.submitResult=async function(id){
  const m=MATCHES.find(function(x){return x.id===id;});if(!m)return;
  const hs=parseInt(document.getElementById('hs-'+id).value);
  const as=parseInt(document.getElementById('as-'+id).value);
  if(isNaN(hs)||isNaN(as)){alert('Enter valid scores.');return;}
  await saveRankSnapshot();
  const result=hs>as?'home':as>hs?'away':'draw';
  const update={result:result,homeScore:hs,awayScore:as};
  Object.assign(m,update);
  await fsSet('matches/'+id,update);
  renderResultList();
};

window.setKOResult=async function(id,res){
  const m=MATCHES.find(function(x){return x.id===id;});if(!m)return;
  await saveRankSnapshot();
  const update={result:res,homeScore:res==='home'?1:0,awayScore:res==='away'?1:0};
  Object.assign(m,update);
  await fsSet('matches/'+id,update);
  renderResultList();
};

window.clearResult=async function(id){
  const m=MATCHES.find(function(x){return x.id===id;});if(!m)return;
  const update={result:null,homeScore:null,awayScore:null};
  Object.assign(m,update);
  await fsSet('matches/'+id,update);
  renderResultList();
};

window.editKOTeams=function(id){
  const m=MATCHES.find(function(x){return x.id===id;});
  const allTeams=Object.values(GROUPS).flat().sort();
  document.getElementById('modalTitle').textContent='SET MATCH TEAMS';
  let html='<div class="form-group"><label class="form-label">Home Team</label>';
  html+='<select class="form-input" id="ko-home" onchange="document.getElementById(\'ko-home-txt\').value=this.value"><option value="">&#8212; Select &#8212;</option>';
  allTeams.forEach(function(t){html+='<option value="'+t+'"'+(m.h===t?' selected':'')+'>'+flag(t)+' '+t+'</option>';});
  html+='</select></div><div class="form-group"><input class="form-input" id="ko-home-txt" placeholder="Or type manually..." value="'+(m.h!=='TBD'?m.h:'')+'"></div>';
  html+='<div class="form-group"><label class="form-label">Away Team</label>';
  html+='<select class="form-input" id="ko-away" onchange="document.getElementById(\'ko-away-txt\').value=this.value"><option value="">&#8212; Select &#8212;</option>';
  allTeams.forEach(function(t){html+='<option value="'+t+'"'+(m.a===t?' selected':'')+'>'+flag(t)+' '+t+'</option>';});
  html+='</select></div><div class="form-group"><input class="form-input" id="ko-away-txt" placeholder="Or type manually..." value="'+(m.a!=='TBD'?m.a:'')+'"></div>';
  html+='<button class="btn btn-gold btn-full" data-id="'+id+'" onclick="window.saveKOTeams(+this.dataset.id)">SAVE TEAMS</button>';
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('detailModal').classList.add('show');
};

window.saveKOTeams=async function(id){
  const m=MATCHES.find(function(x){return x.id===id;});
  const h=document.getElementById('ko-home-txt').value.trim()||document.getElementById('ko-home').value||m.h;
  const a=document.getElementById('ko-away-txt').value.trim()||document.getElementById('ko-away').value||m.a;
  m.h=h;m.a=a;
  await fsSet('matches/'+id,{h:h,a:a});
  window.closeModal();renderResultList();
};

// ── Admin ──
function renderAdmin(){
  if(!CU||CU.role!=='admin')return;
  const players=Object.values(USERS).filter(function(u){return u.role!=='admin';});
  let html='<div class="section-title">&#9881;&#65039; ADMIN PANEL</div>';
  html+='<div class="section-sub">All changes sync instantly to all users.</div>';
  html+='<div class="card"><div class="card-title">+ CREATE NEW USER</div>';
  html+='<div class="admin-grid"><div class="form-group"><label class="form-label">Username</label><input class="form-input" id="newUser" type="text" placeholder="e.g. ahmed_96" autocomplete="off"></div>';
  html+='<div class="form-group"><label class="form-label">Password</label><input class="form-input" id="newPass" type="text" placeholder="Min 4 characters"></div></div>';
  html+='<button class="btn btn-gold" onclick="window.createUser()">CREATE USER</button><div id="createMsg" class="success-msg hidden"></div></div>';
  html+='<div class="card"><div class="card-title">PLAYERS ('+players.length+')</div>';
  if(!players.length){html+='<div class="empty-state" style="padding:14px">No players yet.</div>';}
  else{
    players.forEach(function(u){
      const pts=calcPoints(u.username).total;
      html+='<div class="user-row"><div><div class="user-row-name">'+u.username+'</div><div style="font-size:11px;color:var(--muted)">'+pts+' pts</div></div>';
      html+='<div style="display:flex;gap:6px"><button class="btn btn-outline btn-sm" data-u="'+u.username+'" onclick="window.adminResetPwd(this.dataset.u)">RESET PWD</button><button class="btn btn-red btn-sm" data-u="'+u.username+'" onclick="window.deleteUser(this.dataset.u)">DELETE</button></div></div>';
    });
  }
  html+='</div>';
  html+='<div class="card"><div class="card-title">CHANGE ADMIN PASSWORD</div>';
  html+='<div class="form-group"><label class="form-label">New Password</label><input class="form-input" id="adminPwd" type="password" placeholder="Min 4 characters"></div>';
  html+='<button class="btn btn-outline" onclick="window.changeAdminPwd()">UPDATE PASSWORD</button><div id="pwdMsg" class="success-msg hidden"></div></div>';
  html+='<div class="card"><div class="card-title">SET TROPHY RESULTS</div>';
  html+='<div style="color:var(--muted);font-size:12px;margin-bottom:14px">Set at end of tournament: +10 Scorer, +15 Winner, +10 MVP.</div>';
  html+='<div class="form-group"><label class="form-label">&#9917; Top Goalscorer (actual)</label><select class="form-input" id="trScorer"><option value="">Select...</option>';
  TOP_SCORERS.forEach(function(s){html+='<option value="'+s+'"'+(TROPHY_RESULTS.topScorer===s?' selected':'')+'>'+s+'</option>';});
  html+='</select></div>';
  html+='<div class="form-group"><label class="form-label">&#127941; Tournament Winner (actual)</label><select class="form-input" id="trWinner"><option value="">Select...</option>';
  Object.values(GROUPS).flat().sort().forEach(function(t){html+='<option value="'+t+'"'+(TROPHY_RESULTS.winner===t?' selected':'')+'>'+flag(t)+' '+t+'</option>';});
  html+='</select></div>';
  html+='<div class="form-group"><label class="form-label">&#127775; MVP (actual)</label><select class="form-input" id="trMVP"><option value="">Select...</option>';
  TOP_SCORERS.forEach(function(s){html+='<option value="'+s+'"'+(TROPHY_RESULTS.mvp===s?' selected':'')+'>'+s+'</option>';});
  html+='</select></div>';
  html+='<button class="btn btn-gold" onclick="window.saveTrophyResults()">SAVE TROPHY RESULTS</button><div id="trMsg" class="success-msg hidden"></div></div>';
  html+='<div class="card"><div class="card-title">DANGER ZONE</div>';
  html+='<p style="color:var(--muted);font-size:13px;margin-bottom:12px">Reset all predictions and match results. Cannot be undone.</p>';
  html+='<button class="btn btn-red" onclick="window.resetAll()">RESET ALL DATA</button></div>';
  document.getElementById('mainContent').innerHTML=html;
}

window.createUser=async function(){
  const u=document.getElementById('newUser').value.trim();
  const p=document.getElementById('newPass').value.trim();
  const msg=document.getElementById('createMsg');
  if(!u||!p){msg.textContent='Both fields required.';msg.style.color='var(--red)';msg.classList.remove('hidden');return;}
  if(u.length<2){msg.textContent='Username min 2 chars.';msg.style.color='var(--red)';msg.classList.remove('hidden');return;}
  if(p.length<4){msg.textContent='Password min 4 chars.';msg.style.color='var(--red)';msg.classList.remove('hidden');return;}
  if(USERS[u]||Object.keys(USERS).find(function(k){return k.toLowerCase()===u.toLowerCase();})){msg.textContent='Username already exists.';msg.style.color='var(--red)';msg.classList.remove('hidden');return;}
  const {hash,salt}=await hashPassword(p);
  const newUser={username:u,passwordHash:hash,salt,role:'player',createdAt:Date.now()};
  await fsSet('users/'+u,newUser);USERS[u]=newUser;
  document.getElementById('newUser').value='';document.getElementById('newPass').value='';
  msg.textContent='&#10003; User "'+u+'" created!';msg.style.color='var(--green)';msg.classList.remove('hidden');
  setTimeout(function(){msg.classList.add('hidden');renderAdmin();},2000);
};

window.adminResetPwd=async function(username){
  const np=prompt('Set new password for "'+username+'" (min 4 chars):');
  if(!np)return;if(np.length<4){alert('Password too short.');return;}
  const {hash,salt}=await hashPassword(np);
  await fsSet('users/'+username,{passwordHash:hash,salt:salt});
  if(USERS[username]){USERS[username].passwordHash=hash;USERS[username].salt=salt;}
  alert('&#10003; Password for "'+username+'" updated.');
};

window.deleteUser=async function(username){
  if(!confirm('Delete "'+username+'"? All their predictions will be removed.'))return;
  await Promise.all([fsDelete('users/'+username),fsDelete('predictions/'+username),fsDelete('trophyPicks/'+username)]);
  delete USERS[username];delete PREDICTIONS[username];delete TROPHY_PICKS[username];
  renderAdmin();
};

window.changeAdminPwd=async function(){
  const p=document.getElementById('adminPwd').value.trim();
  const msg=document.getElementById('pwdMsg');
  if(!p||p.length<4){msg.textContent='Min 4 characters.';msg.style.color='var(--red)';msg.classList.remove('hidden');return;}
  const {hash,salt}=await hashPassword(p);
  await fsSet('users/'+ADMIN_USER,{passwordHash:hash,salt:salt});
  if(CU){CU.passwordHash=hash;CU.salt=salt;}
  if(USERS[ADMIN_USER]){USERS[ADMIN_USER].passwordHash=hash;USERS[ADMIN_USER].salt=salt;}
  msg.textContent='&#10003; Password updated.';msg.style.color='var(--green)';msg.classList.remove('hidden');
  document.getElementById('adminPwd').value='';
  setTimeout(function(){msg.classList.add('hidden');},3000);
};

window.saveTrophyResults=async function(){
  const scorer=document.getElementById('trScorer').value;
  const winner=document.getElementById('trWinner').value;
  const mvp=document.getElementById('trMVP').value;
  const msg=document.getElementById('trMsg');
  if(!scorer||!winner||!mvp){msg.textContent='Please select all three results.';msg.style.color='var(--red)';msg.classList.remove('hidden');return;}
  await fsSet('config/trophyResults',{topScorer:scorer,winner:winner,mvp:mvp,setAt:Date.now()});
  TROPHY_RESULTS={topScorer:scorer,winner:winner,mvp:mvp};
  msg.textContent='&#10003; Trophy results saved! Bonus points awarded.';msg.style.color='var(--green)';msg.classList.remove('hidden');
  setTimeout(function(){msg.classList.add('hidden');renderAdmin();},3000);
};

window.saveManualPoints=async function(){
  const uname=document.getElementById('mpUser').value;
  const val=parseInt(document.getElementById('mpVal').value);
  const msg=document.getElementById('mpMsg');
  if(!uname){msg.textContent='Please select a player.';msg.style.color='var(--red)';msg.classList.remove('hidden');return;}
  if(isNaN(val)){msg.textContent='Please enter a valid number (positive or negative).';msg.style.color='var(--red)';msg.classList.remove('hidden');return;}
  const current=(MANUAL_POINTS[uname])||0;
  const newVal=current+val;
  await fsSet('config/manualPoints',{[uname]:newVal});
  MANUAL_POINTS[uname]=newVal;
  msg.textContent='\u2713 '+val+' points '+( val>=0?'added to':'removed from')+' '+uname+'. New manual total: '+newVal+' pts.';
  msg.style.color='var(--green)';msg.classList.remove('hidden');
  document.getElementById('mpVal').value='';
  setTimeout(function(){msg.classList.add('hidden');renderAdmin();},3000);
};

window.resetAll=async function(){
  if(!confirm('Reset ALL predictions and results? This cannot be undone.'))return;
  const {getDocs:gd,collection:col,deleteDoc:dd}={getDocs,collection,deleteDoc};
  const [ps,ms]=await Promise.all([gd(col(db,'predictions')),gd(col(db,'matches'))]);
  await Promise.all([...ps.docs.map(function(d){return dd(d.ref);}), ...ms.docs.map(function(d){return dd(d.ref);})]);
  PREDICTIONS={};MATCHES=[...makeGroupMatches(),...makeKnockoutMatches()];
  renderAdmin();alert('All data reset.');
};

document.getElementById('regPass2').addEventListener('keydown',function(e){if(e.key==='Enter')window.doRegister();});
