body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;min-height:100vh}
header{background:linear-gradient(135deg,#0d1526,#1a2a4a);border-bottom:2px solid var(--gold);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);letter-spacing:2px;text-shadow:0 0 20px rgba(245,200,66,.4)}
.logo span{color:#fff}
.header-right{display:flex;align-items:center;gap:8px}
.user-badge{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--gold);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px}
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;border-radius:6px;border:none;cursor:pointer;transition:all .2s}
.btn-gold{background:var(--gold);color:#0a0e1a}.btn-gold:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}.btn-outline:hover{background:rgba(245,200,66,.1)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#c0313d}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-full{width:100%}
nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav-tab{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:13px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.nav-tab:hover{color:var(--text)}.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
main{max-width:920px;margin:0 auto;padding:22px 14px 80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#fff;letter-spacing:3px;margin-bottom:4px}
.section-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
/* LOGIN */
#loginScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1a3a6a,#0a0e1a 60%);padding:20px}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:46px;color:var(--gold);letter-spacing:4px;text-shadow:0 0 40px rgba(245,200,66,.5);text-align:center;line-height:1;margin-bottom:4px}
.login-logo span{color:#fff}
.login-sub{color:var(--muted);font-size:12px;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:10px}
.login-tagline{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:4px;text-align:center;margin-bottom:28px;opacity:.85}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:350px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.form-group{margin-bottom:13px}
.form-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.form-input{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--gold)}
select.form-input option{background:var(--bg3)}
.error-msg{color:var(--red);font-size:13px;margin-top:7px}
.success-msg{color:var(--green);font-size:13px;margin-top:7px}

.match-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.match-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:4px}
.match-group-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(245,200,66,.1);padding:2px 8px;border-radius:4px}
.match-date{color:var(--muted);font-size:11px}
.match-venue{color:var(--muted);font-size:10px;font-style:italic}
.match-teams{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.team-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;flex:1;text-align:center}
.vs-badge{font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 6px;flex-shrink:0}
.prediction-btns{display:flex;gap:6px}
.pred-btn{flex:1;padding:8px 3px;border-radius:7px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;text-align:center}
.pred-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pred-btn.sel-home{background:rgba(46,196,106,.15);border-color:var(--green);color:var(--green)}
.pred-btn.sel-draw{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue)}
.pred-btn.sel-away{background:rgba(230,57,70,.15);border-color:var(--red);color:var(--red)}
.pred-btn:disabled{opacity:.4;cursor:not-allowed}
.deadline-badge{font-size:10px;color:var(--muted);margin-top:7px;text-align:right}
.deadline-badge.locked{color:var(--red)}
.result-badge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.res-correct{background:rgba(46,196,106,.2);color:var(--green);border:1px solid var(--green)}
.res-wrong{background:rgba(230,57,70,.15);color:var(--red);border:1px solid var(--red)}
.res-pending{background:rgba(245,200,66,.1);color:var(--gold);border:1px solid var(--gold)}
/* LEADERBOARD */
.lb-row{display:flex;align-items:center;padding:11px 13px;border-radius:8px;margin-bottom:7px;background:var(--bg3);border:1px solid var(--border);gap:11px;transition:transform .15s;cursor:pointer}
.lb-row:hover{transform:translateX(3px)}
.rank-num{font-family:'Bebas Neue',sans-serif;font-size:20px;width:28px;text-align:center;color:var(--muted);flex-shrink:0}
.rank-1 .rank-num{color:var(--gold)}.rank-2 .rank-num{color:#c0c0c0}.rank-3 .rank-num{color:#cd7f32}
.rank-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;flex:1}
.rank-points{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold)}
.rank-pts-label{font-size:10px;color:var(--muted);font-family:'Barlow Condensed',sans-serif}

.group-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.group-tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.group-tab:hover{border-color:var(--gold);color:var(--gold)}
.group-tab.active{background:var(--gold);color:#0a0e1a;border-color:var(--gold)}

.trophy-box{background:linear-gradient(135deg,#1a2a1a,#1a2235);border:1.5px solid rgba(245,200,66,.3);border-radius:12px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.trophy-box::before{content:'🏆';position:absolute;right:-10px;top:-10px;font-size:70px;opacity:.07}
.trophy-title{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}

.score-dash{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted)}
.result-input-area{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:84vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px;margin-bottom:18px}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;margin-top:-3px}
.modal-close:hover{color:var(--text)}
/* MISC */
.badge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.badge-gold{background:rgba(245,200,66,.15);color:var(--gold);border:1px solid rgba(245,200,66,.3)}
.badge-red{background:rgba(230,57,70,.15);color:var(--red);border:1px solid rgba(230,57,70,.3)}

.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.empty-state{text-align:center;color:var(--muted);padding:36px 20px;font-size:14px}
.tag-knockout{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,#e63946,#b81c28);padding:2px 8px;border-radius:4px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-pred{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px}
.detail-pts{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--gold)}

.user-row-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* SPINNER */
.spinner-overlay{position:fixed;inset:0;background:rgba(10,14,26,.85);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-text{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}

.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .28s ease forwards}
.hidden{display:none!important}
.mt8{margin-top:8px}.mt16{margin-top:16px}
.flex{display:flex}.gap8{gap:8px}.items-center{align-items:center}.justify-between{justify-content:space-between}

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));

// ── Firestore helpers ─────────────────────────────────────
async function fsSet(path, data) {
  await setDoc(doc(db, ...path.split('/')), data, { merge: true });
}
async function fsGet(path) {
  const snap = await getDoc(doc(db, ...path.split('/')));
  return snap.exists() ? snap.data() : null;
}
async function fsDelete(path) {
  await deleteDoc(doc(db, ...path.split('/')));
}
async function fsCollection(col) {
  const snap = await getDocs(collection(db, col));
  const out = {};
  snap.forEach(d => { out[d.id] = d.data(); });
  return out;
}

// ── Real-time listeners ───────────────────────────────────
function startListeners() {
  // Listen to matches (results)
  onSnapshot(collection(db, 'matches'), snap => {
    snap.forEach(d => {
      const idx = MATCHES.findIndex(m => m.id === parseInt(d.id));
      if (idx !== -1) Object.assign(MATCHES[idx], d.data());
    });
    if (ACTIVE_TAB === 'predictions') renderMatchList();
    if (ACTIVE_TAB === 'results') renderResultList();
    if (ACTIVE_TAB === 'leaderboard') renderLeaderboard();
  });
  // Listen to predictions
  onSnapshot(collection(db, 'predictions'), snap => {
    snap.forEach(d => { PREDICTIONS[d.id] = d.data(); });
    if (ACTIVE_TAB === 'leaderboard') renderLeaderboard();
    if (ACTIVE_TAB === 'predictions' && CU) renderMatchList();
  });
  // Listen to trophy picks
  onSnapshot(collection(db, 'trophyPicks'), snap => {
    snap.forEach(d => { TROPHY_PICKS[d.id] = d.data(); });
    if (ACTIVE_TAB === 'trophy') renderTrophy();
  });
  // Listen to trophy results (admin sets these at end of tournament)
  onSnapshot(doc(db, 'config', 'trophyResults'), snap => {
    if (snap.exists()) TROPHY_RESULTS = snap.data();
    if (ACTIVE_TAB === 'leaderboard') renderLeaderboard();
  });
  // Listen to trophy results
  onSnapshot(doc(db, 'config', 'trophyResults'), snap => {
    if (snap.exists()) { TROPHY_RESULTS = snap.data(); }
    if (ACTIVE_TAB === 'leaderboard') renderLeaderboard();
  });
  // Listen to users
  onSnapshot(collection(db, 'users'), snap => {
    snap.forEach(d => { USERS[d.id] = d.data(); });
    if (ACTIVE_TAB === 'admin') renderAdmin();
    if (ACTIVE_TAB === 'leaderboard') renderLeaderboard();
  });
}

function showError(msg) {
  const el = document.getElementById('spinnerOverlay');
  el.innerHTML = `
    <div style="text-align:center;padding:30px;max-width:340px">
      <div style="font-size:36px;margin-bottom:16px">⚠️</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:#f5c842;letter-spacing:2px;margin-bottom:12px">CONNECTION ERROR</div>
      <div style="color:#8892a4;font-size:13px;line-height:1.7;margin-bottom:20px">${msg}</div>
      <button onclick="location.reload()" style="background:#f5c842;color:#0a0e1a;border:none;border-radius:8px;padding:10px 24px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;cursor:pointer;">RETRY</button>
    </div>`;
}

async function bootstrap() {
  const spinnerText = document.querySelector('.spinner-text');
  try {
    spinnerText.textContent = 'Connecting to Firebase...';

    // 10 second timeout
    const timeout = new Promise((_,reject) => setTimeout(() => reject(new Error('TIMEOUT')), 10000));

    spinnerText.textContent = 'Loading users...';
    USERS = await Promise.race([fsCollection('users'), timeout]);

    spinnerText.textContent = 'Loading predictions...';
    PREDICTIONS = await Promise.race([fsCollection('predictions'), timeout]);

    spinnerText.textContent = 'Loading trophy picks...';
    TROPHY_PICKS = await Promise.race([fsCollection('trophyPicks'), timeout]);

    spinnerText.textContent = 'Loading trophy results...';
    const trDoc = await Promise.race([fsGet('config/trophyResults'), timeout]);
    if (trDoc) TROPHY_RESULTS = trDoc;

    spinnerText.textContent = 'Loading match data...';
    const matchDocs = await Promise.race([fsCollection('matches'), timeout]);
    Object.entries(matchDocs).forEach(([id, data]) => {
      const idx = MATCHES.findIndex(m => m.id === parseInt(id));
      if (idx !== -1) Object.assign(MATCHES[idx], data);
    });

    spinnerText.textContent = 'Setting up admin...';
    if (!USERS[ADMIN_USER]) {
      const { hash, salt } = await hashPassword(ADMIN_PASS);
      await fsSet(`users/${ADMIN_USER}`, {
        username: ADMIN_USER, passwordHash: hash, salt, role: 'admin', createdAt: Date.now()
      });
      USERS[ADMIN_USER] = { username: ADMIN_USER, passwordHash: hash, salt, role: 'admin' };
    }

    startListeners();
    document.getElementById('spinnerOverlay').style.display = 'none';
    document.getElementById('loginScreen').classList.remove('hidden');

  } catch(e) {
    console.error('Bootstrap error:', e);
    if (e.message === 'TIMEOUT') {
      showError('Firebase took too long to respond.<br><br>Please check:<br>1. Your internet connection<br>2. Firebase Firestore rules are set to allow read/write<br>3. Firestore database is created in Firebase Console');
    } else if (e.code === 'permission-denied' || (e.message && e.message.includes('permission'))) {
      showError('Firebase blocked the request (permission denied).<br><br>Go to Firebase Console → Firestore Database → Rules and make sure you published:<br><br><code style="background:#1a2235;padding:4px 8px;border-radius:4px;font-size:11px">allow read, write: if true;</code>');
    } else {
      showError('Error: ' + (e.message || e.code || 'Unknown error') + '<br><br>Check that your Firestore database has been created in the Firebase Console.');
    }
  }
}
bootstrap();

// ── Helpers ───────────────────────────────────────────────
function isLocked(m) {
  return new Date() >= new Date(new Date(m.dt).getTime() - 45*60*1000);
}
function isTrophyLocked() {
  return new Date() >= TROPHY_LOCK;
}
function fmtDate(dt) {
  const d = new Date(dt);
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ' · ' +
    d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/New_York',hour12:true}) + ' ET';
}
function fmtDeadline(m) {
  const d = new Date(new Date(m.dt).getTime() - 45*60*1000);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' ' +
    d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/New_York',hour12:true}) + ' ET';
}
// Global trophy results set by admin
// STATE stored in Firestore under doc 'config/trophyResults'
// { topScorer: '...', winner: '...', mvp: '...' }
let TROPHY_RESULTS = {};

function calcPoints(username) {
  const preds = PREDICTIONS[username] || {};
  let pts = 0, details = [];
  MATCHES.forEach(m => {
    if (m.result && preds[m.id]) {
      const ok = preds[m.id] === m.result;
      if (ok) pts += 3;
      details.push({ match: m, pred: preds[m.id], correct: ok });
    }
  });
  // Bonus points from trophy picks
  const tp = TROPHY_PICKS[username] || {};
  let bonusDetails = [];
  if (TROPHY_RESULTS.topScorer && tp.scorer) {
    const ok = tp.scorer === TROPHY_RESULTS.topScorer;
    if (ok) pts += 10;
    bonusDetails.push({ label: '⚽ Top Goalscorer', pick: tp.scorer, correct: ok, pts: 10 });
  }
  if (TROPHY_RESULTS.winner && tp.winner) {
    const ok = tp.winner === TROPHY_RESULTS.winner;
    if (ok) pts += 10;
    bonusDetails.push({ label: '🥇 Tournament Winner', pick: tp.winner, correct: ok, pts: 10 });
  }
  if (TROPHY_RESULTS.mvp && tp.mvp) {
    const ok = tp.mvp === TROPHY_RESULTS.mvp;
    if (ok) pts += 10;
    bonusDetails.push({ label: '🌟 MVP', pick: tp.mvp, correct: ok, pts: 10 });
  }
  return { total: pts, details, bonusDetails };
}

// ── Auth ──────────────────────────────────────────────────
window.doLogin = async function() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.classList.add('hidden');
  const userData = USERS[u] || USERS[Object.keys(USERS).find(k=>k.toLowerCase()===u.toLowerCase())];
  if (!userData) { err.textContent = 'Invalid username or password.'; err.classList.remove('hidden'); return; }
  const ok = await verifyPassword(p, userData.salt, userData.passwordHash);
  if (!ok) { err.textContent = 'Invalid username or password.'; err.classList.remove('hidden'); return; }
  CU = userData;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('headerUser').textContent = userData.username.toUpperCase() + (userData.role === 'admin' ? ' ★' : '');
  renderNav(); showTab('predictions');
};

window.doRegister = async function() {
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const p2 = document.getElementById('regPass2').value;
  const err = document.getElementById('regError');
  const suc = document.getElementById('regSuccess');
  err.classList.add('hidden'); suc.classList.add('hidden');
  if (!u || u.length < 2) { err.textContent = 'Username must be at least 2 characters.'; err.classList.remove('hidden'); return; }
  if (!p || p.length < 4) { err.textContent = 'Password must be at least 4 characters.'; err.classList.remove('hidden'); return; }
  if (p !== p2) { err.textContent = 'Passwords do not match.'; err.classList.remove('hidden'); return; }
  if (USERS[u] || Object.keys(USERS).find(k=>k.toLowerCase()===u.toLowerCase())) { err.textContent = 'Username already taken.'; err.classList.remove('hidden'); return; }
  if (u.toLowerCase() === ADMIN_USER.toLowerCase()) { err.textContent = 'That username is not available.'; err.classList.remove('hidden'); return; }
  const { hash, salt } = await hashPassword(p);
  const newUser = { username: u, passwordHash: hash, salt, role: 'player', createdAt: Date.now() };
  await fsSet(`users/${u}`, newUser);
  USERS[u] = newUser;
  document.getElementById('regUser').value = '';
  document.getElementById('regPass').value = '';
  document.getElementById('regPass2').value = '';
  suc.textContent = '✓ Account created! You can now sign in.';
  suc.classList.remove('hidden');
  setTimeout(() => switchTab('signin'), 2000);
};

window.doLogout = function() {
  CU = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';

};

function renderPredictions() {
  const stages = [...new Set(MATCHES.map(m=>m.stage))].sort((a,b)=>STAGES_ORDER.indexOf(a)-STAGES_ORDER.indexOf(b));
  document.getElementById('mainContent').innerHTML = `
    <div class="section-title">⚽ MATCH PREDICTIONS</div>
    <div class="section-sub">Pick a result for each match. Locked 45 mins before kick-off.</div>
    <div class="group-tabs">${stages.map(s=>`<button class="group-tab ${PRED_FILTER===s?'active':''}" onclick="filterPred('${s}')">${s}</button>`).join('')}</div>
    <div id="matchList"></div>`;

window.filterPred = function(s) {
  PRED_FILTER = s;
  document.querySelectorAll('.group-tab').forEach(el=>el.classList.toggle('active',el.textContent.trim()===s));
  renderMatchList();
};

function renderMatchList() {
  const preds = PREDICTIONS[CU.username] || {};
  let matches;
  if (PRED_FILTER === 'All Matches') {
    matches = [...MATCHES].sort((a,b) => new Date(a.dt) - new Date(b.dt));
  } else {
    matches = MATCHES.filter(m=>m.stage===PRED_FILTER);
  }
  const c = document.getElementById('matchList'); if(!c) return;
  if (!matches.length) { c.innerHTML=`<div class="empty-state">No matches in this stage yet.</div>`; return; }
  const allSortedPred = [...MATCHES].sort((a,b)=>new Date(a.dt)-new Date(b.dt));
  c.innerHTML = matches.map(m => {
    const locked = isLocked(m);
    const pred = preds[m.id];
    const ko = m.type === 'knockout';
    const sortedNum = allSortedPred.indexOf(m) + 1;
    let correctness = '';
    if (m.result && pred) {
      correctness = pred===m.result ? '<span class="result-badge res-correct">✓ +3 pts</span>' : '<span class="result-badge res-wrong">✗ 0 pts</span>';
    } else if (locked && !m.result && pred) {
      correctness = '<span class="result-badge res-pending">Awaiting result</span>';
    }
    const score = m.result ? `<div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);text-align:center;margin:-2px 0 8px">${m.homeScore} — ${m.awayScore}</div>` : '';
    let btns = ko
      ? `<div class="prediction-btns">
          <button class="pred-btn ${pred==='home'?'sel-home':''}" onclick="setPred(${m.id},'home')" ${locked?'disabled':''}>${flag(m.h)} ${m.h} WIN</button>
          <button class="pred-btn ${pred==='away'?'sel-away':''}" onclick="setPred(${m.id},'away')" ${locked?'disabled':''}>${flag(m.a)} ${m.a} WIN</button>
        </div>`
      : `<div class="prediction-btns">
          <button class="pred-btn ${pred==='home'?'sel-home':''}" onclick="setPred(${m.id},'home')" ${locked?'disabled':''}>${flag(m.h)} ${m.h}</button>
          <button class="pred-btn ${pred==='draw'?'sel-draw':''}" onclick="setPred(${m.id},'draw')" ${locked?'disabled':''}>DRAW</button>
          <button class="pred-btn ${pred==='away'?'sel-away':''}" onclick="setPred(${m.id},'away')" ${locked?'disabled':''}>${flag(m.a)} ${m.a}</button>
        </div>`;
    return `<div class="match-card">
      <div class="match-header">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 7px;letter-spacing:1px">M${sortedNum}</span>
          <span class="${ko?'tag-knockout':'match-group-label'}">${ko&&m.label?m.label:m.stage}</span>
        </div>
        <div style="text-align:right"><div class="match-date">${fmtDate(m.dt)}</div><div class="match-venue">${m.venue}</div></div>
      </div>
      ${score}
      <div class="match-teams">
        <div class="team-name">${flag(m.h)} ${m.h}</div>
        <div class="vs-badge">VS</div>
        <div class="team-name">${m.a} ${flag(m.a)}</div>
      </div>
      ${btns}
      <div class="flex justify-between items-center mt8">
        <div>${correctness}</div>
        <div class="deadline-badge ${locked?'locked':''}">${locked?'🔒 Locked':'⏰ Deadline: '+fmtDeadline(m)}</div>
      </div>
    </div>`;
  }).join('');
}

window.setPred = async function(matchId, val) {
  const m = MATCHES.find(x=>x.id===matchId);
  if (!m || isLocked(m)) return;
  if (!PREDICTIONS[CU.username]) PREDICTIONS[CU.username] = {};
  PREDICTIONS[CU.username][matchId] = val;
  await fsSet(`predictions/${CU.username}`, { [matchId]: val });
  renderMatchList();
};

  html += '<div class="detail-row"><span>&#9917; Top Scorer</span><span style="color:var(--text);font-size:13px">' + (tp.scorer || '&mdash;') + '</span></div>';
  html += '<div class="detail-row"><span>&#127941; Winner</span><span style="color:var(--text);font-size:13px">' + (tp.winner ? flag(tp.winner) + ' ' + tp.winner : '&mdash;') + '</span></div>';
  html += '<div class="detail-row"><span>&#127775; MVP</span><span style="color:var(--text);font-size:13px">' + (tp.mvp || '&mdash;') + '</span></div>';
  html += '<div class="divider"></div>';

  if (pts.bonusDetails && pts.bonusDetails.length) {
    html += '<div style="font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Bonus Points</div>';
    pts.bonusDetails.forEach(function(b) {
      html += '<div class="detail-row">';
      html += '<div><div style="font-size:12px;color:var(--muted)">' + b.label + '</div><div class="detail-pred">' + b.pick + '</div></div>';
      html += '<div>' + (b.correct ? '<span class="result-badge res-correct">+10</span>' : '<span class="result-badge res-wrong">0</span>') + '</div>';
      html += '</div>';
    });
    html += '<div class="divider"></div>';
  }

  html += '<div style="font-family:Barlow Condensed,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Match Predictions</div>';
  if (!pts.details.length) {
    html += '<div class="empty-state" style="padding:14px">No results entered yet.</div>';
  } else {
    pts.details.forEach(function(d) {
      const pl = d.pred === 'home' ? d.match.h + ' Win' : d.pred === 'draw' ? 'Draw' : d.match.a + ' Win';
      html += '<div class="detail-row">';
      html += '<div><div style="font-size:12px;color:var(--muted)">' + d.match.h + ' vs ' + d.match.a + '</div><div class="detail-pred">' + pl + '</div></div>';
      html += '<div>' + (d.correct ? '<span class="result-badge res-correct">+3</span>' : '<span class="result-badge res-wrong">0</span>') + '</div>';
      html += '</div>';
    });
  }
  document.getElementById('modalTitle').textContent = username.toUpperCase() + ' — BREAKDOWN';
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('detailModal').classList.add('show');
}
window.closeModal = function() { document.getElementById('detailModal').classList.remove('show'); };

// ── Results (Admin) ───────────────────────────────────────
function renderResults() {
  if (!CU || CU.role !== 'admin') return;
  const stages = [...new Set(MATCHES.map(m=>m.stage))].sort((a,b)=>STAGES_ORDER.indexOf(a)-STAGES_ORDER.indexOf(b));
  const allStages = ['All Matches', ...stages];
  document.getElementById('mainContent').innerHTML = `
    <div class="section-title">✏️ ENTER RESULTS</div>
    <div class="section-sub">Enter final scores. All players' points update instantly.</div>
    <div class="group-tabs">${allStages.map(s=>`<button class="group-tab ${RES_FILTER===s?'active':''}" onclick="window.filterRes('${s}')">${s}</button>`).join('')}</div>
    <div id="resultList"></div>`;
  renderResultList();
}

window.filterRes = function(s) {
  RES_FILTER = s;
  document.querySelectorAll('.group-tab').forEach(el=>el.classList.toggle('active',el.textContent.trim()===s));
  renderResultList();
};

function renderResultList() {
  let matches;
  if (RES_FILTER === 'All Matches') {
    matches = [...MATCHES].sort((a,b) => new Date(a.dt) - new Date(b.dt));
  } else {
    matches = MATCHES.filter(m=>m.stage===RES_FILTER).sort((a,b) => new Date(a.dt) - new Date(b.dt));
  }
  const c = document.getElementById('resultList'); if(!c) return;
  if (!matches.length) { c.innerHTML=`<div class="empty-state">No matches.</div>`; return; }
  const allSortedRes = [...MATCHES].sort((a,b)=>new Date(a.dt)-new Date(b.dt));
  c.innerHTML = matches.map(m => {
    const ko = m.type === 'knockout';
    const hasResult = m.result !== null;
    let rSection = ko
      ? `<div class="result-input-area">
          <button class="pred-btn ${m.result==='home'?'sel-home':''}" style="flex:1;padding:9px" onclick="setKOResult(${m.id},'home')">${flag(m.h)} ${m.h} WIN</button>
          <button class="pred-btn ${m.result==='away'?'sel-away':''}" style="flex:1;padding:9px" onclick="setKOResult(${m.id},'away')">${flag(m.a)} ${m.a} WIN</button>
          ${hasResult?`<button class="btn btn-outline btn-sm" onclick="clearResult(${m.id})">CLEAR</button>`:''}
        </div>
        <div class="mt8"><button class="btn btn-outline btn-sm" onclick="editKOTeams(${m.id})">Set Teams</button></div>`
      : `<div class="result-input-area">
          <input class="score-input" type="number" min="0" max="30" id="hs-${m.id}" value="${m.homeScore!==null?m.homeScore:''}" placeholder="0">
          <span class="score-dash">—</span>
          <input class="score-input" type="number" min="0" max="30" id="as-${m.id}" value="${m.awayScore!==null?m.awayScore:''}" placeholder="0">
          <button class="btn btn-gold btn-sm" onclick="submitResult(${m.id})">SAVE</button>
          ${hasResult?`<button class="btn btn-outline btn-sm" onclick="clearResult(${m.id})">CLEAR</button>`:''}
        </div>`;
    return `<div class="match-card">
      <div class="match-header">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 7px;letter-spacing:1px">M${allSortedRes.indexOf(m)+1}</span>
          <span class="${ko?'tag-knockout':'match-group-label'}">${ko&&m.label?m.label:m.stage}</span>
        </div>
        <div style="text-align:right">
          <div class="match-date">${fmtDate(m.dt)}</div>
          ${hasResult?`<span class="badge badge-green">✓ Saved</span>`:''}
        </div>
      </div>
      <div class="match-teams">
        <div class="team-name">${flag(m.h)} ${m.h}</div>
        <div class="vs-badge">VS</div>
        <div class="team-name">${m.a} ${flag(m.a)}</div>
      </div>
      ${rSection}
    </div>`;
  }).join('');
}

window.submitResult = async function(id) {
  const m = MATCHES.find(x=>x.id===id); if(!m) return;
  const hs = parseInt(document.getElementById('hs-'+id).value);
  const as = parseInt(document.getElementById('as-'+id).value);
  if (isNaN(hs)||isNaN(as)) { alert('Enter valid scores.'); return; }
  const result = hs>as?'home':as>hs?'away':'draw';
  const update = { result, homeScore: hs, awayScore: as };
  Object.assign(m, update);
  await fsSet(`matches/${id}`, update);
  renderResultList();
};

window.setKOResult = async function(id, res) {
  const m = MATCHES.find(x=>x.id===id); if(!m) return;
  const update = { result: res, homeScore: res==='home'?1:0, awayScore: res==='away'?1:0 };
  Object.assign(m, update);
  await fsSet(`matches/${id}`, update);
  renderResultList();
};

window.clearResult = async function(id) {
  const m = MATCHES.find(x=>x.id===id); if(!m) return;
  const update = { result: null, homeScore: null, awayScore: null };
  Object.assign(m, update);
  await fsSet(`matches/${id}`, update);
  renderResultList();
};

window.editKOTeams = function(id) {
  const m = MATCHES.find(x=>x.id===id);
  const allTeams = Object.values(GROUPS).flat().sort();
  document.getElementById('modalTitle').textContent = 'SET MATCH TEAMS';
  document.getElementById('modalContent').innerHTML = `
    <div class="form-group"><label class="form-label">Home Team (select or type)</label>
      <select class="form-input" id="ko-home" onchange="document.getElementById('ko-home-txt').value=this.value">
        <option value="">— Select —</option>
        ${allTeams.map(t=>`<option value="${t}" ${m.h===t?'selected':''}>${flag(t)} ${t}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><input class="form-input" id="ko-home-txt" placeholder="Or type manually..." value="${m.h!=='TBD'?m.h:''}"></div>
    <div class="form-group"><label class="form-label">Away Team (select or type)</label>
      <select class="form-input" id="ko-away" onchange="document.getElementById('ko-away-txt').value=this.value">
        <option value="">— Select —</option>
        ${allTeams.map(t=>`<option value="${t}" ${m.a===t?'selected':''}>${flag(t)} ${t}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><input class="form-input" id="ko-away-txt" placeholder="Or type manually..." value="${m.a!=='TBD'?m.a:''}"></div>
    <button class="btn btn-gold btn-full" onclick="saveKOTeams(${id})">SAVE TEAMS</button>`;
  document.getElementById('detailModal').classList.add('show');
};

window.saveKOTeams = async function(id) {
  const m = MATCHES.find(x=>x.id===id);
  const h = document.getElementById('ko-home-txt').value.trim() || document.getElementById('ko-home').value || m.h;
  const a = document.getElementById('ko-away-txt').value.trim() || document.getElementById('ko-away').value || m.a;
  m.h = h; m.a = a;
  await fsSet(`matches/${id}`, { h, a });
  closeModal(); renderResultList();
};

// ── Admin ─────────────────────────────────────────────────
function renderAdmin() {
  if (!CU || CU.role !== 'admin') return;
  const players = Object.values(USERS).filter(function(u){ return u.role !== 'admin'; });

  let html = '';
  html += '<div class="section-title">ADMIN PANEL</div>';
  html += '<div class="section-sub">All changes sync instantly to all users.</div>';

  // Create user
  html += '<div class="card"><div class="card-title">+ CREATE NEW USER</div>';
  html += '<div class="admin-grid">';
  html += '<div class="form-group"><label class="form-label">Username</label><input class="form-input" id="newUser" type="text" placeholder="e.g. ahmed_96" autocomplete="off"></div>';
  html += '<div class="form-group"><label class="form-label">Password</label><input class="form-input" id="newPass" type="text" placeholder="Min 4 characters"></div>';
  html += '</div>';
  html += '<button class="btn btn-gold" onclick="window.createUser()">CREATE USER</button>';
  html += '<div id="createMsg" class="success-msg hidden"></div></div>';

  // Players list
  html += '<div class="card"><div class="card-title">PLAYERS (' + players.length + ')</div>';
  if (!players.length) {
    html += '<div class="empty-state" style="padding:14px">No players yet.</div>';
  } else {
    players.forEach(function(u) {
      const pts = calcPoints(u.username).total;
      html += '<div class="user-row">';
      html += '<div><div class="user-row-name">' + u.username + '</div>';
      html += '<div style="font-size:11px;color:var(--muted)">' + pts + ' pts</div></div>';
      html += '<div style="display:flex;gap:6px">';
      html += '<button class="btn btn-outline btn-sm" data-u="' + u.username + '" onclick="window.adminResetPwd(this.dataset.u)">RESET PWD</button>';
      html += '<button class="btn btn-red btn-sm" data-u="' + u.username + '" onclick="window.deleteUser(this.dataset.u)">DELETE</button>';
      html += '</div></div>';
    });
  }
  html += '</div>';

  // Change admin password
  html += '<div class="card"><div class="card-title">CHANGE ADMIN PASSWORD</div>';
  html += '<div class="form-group"><label class="form-label">New Password</label><input class="form-input" id="adminPwd" type="password" placeholder="Min 4 characters"></div>';
  html += '<button class="btn btn-outline" onclick="window.changeAdminPwd()">UPDATE PASSWORD</button>';
  html += '<div id="pwdMsg" class="success-msg hidden"></div></div>';

  // Trophy results
  html += '<div class="card"><div class="card-title">SET TROPHY RESULTS</div>';
  html += '<div style="color:var(--muted);font-size:12px;margin-bottom:14px">Set at end of tournament to award +10 bonus points automatically.</div>';

  html += '<div class="form-group"><label class="form-label">Top Goalscorer (actual)</label><select class="form-input" id="trScorer"><option value="">Select...</option>';
  TOP_SCORERS.forEach(function(s) {
    html += '<option value="' + s + '"' + (TROPHY_RESULTS.topScorer === s ? ' selected' : '') + '>' + s + '</option>';
  });
  html += '</select></div>';

  html += '<div class="form-group"><label class="form-label">Tournament Winner (actual)</label><select class="form-input" id="trWinner"><option value="">Select...</option>';
  Object.values(GROUPS).flat().sort().forEach(function(t) {
    html += '<option value="' + t + '"' + (TROPHY_RESULTS.winner === t ? ' selected' : '') + '>' + flag(t) + ' ' + t + '</option>';
  });
  html += '</select></div>';

  html += '<div class="form-group"><label class="form-label">MVP (actual)</label><select class="form-input" id="trMVP"><option value="">Select...</option>';
  TOP_SCORERS.forEach(function(s) {
    html += '<option value="' + s + '"' + (TROPHY_RESULTS.mvp === s ? ' selected' : '') + '>' + s + '</option>';
  });
  html += '</select></div>';

  html += '<button class="btn btn-gold" onclick="window.saveTrophyResults()">SAVE TROPHY RESULTS</button>';
  html += '<div id="trMsg" class="success-msg hidden"></div></div>';

  // Danger zone
  html += '<div class="card"><div class="card-title">DANGER ZONE</div>';
  html += '<p style="color:var(--muted);font-size:13px;margin-bottom:12px">Reset all predictions and match results. Cannot be undone.</p>';
  html += '<button class="btn btn-red" onclick="window.resetAll()">RESET ALL DATA</button></div>';

  document.getElementById('mainContent').innerHTML = html;
}

window.createUser = async function() {
  const u = document.getElementById('newUser').value.trim();
  const p = document.getElementById('newPass').value.trim();
  const msg = document.getElementById('createMsg');
  if (!u||!p) { msg.textContent='Both fields required.'; msg.style.color='var(--red)'; msg.classList.remove('hidden'); return; }
  if (u.length<2) { msg.textContent='Username min 2 chars.'; msg.style.color='var(--red)'; msg.classList.remove('hidden'); return; }
  if (p.length<4) { msg.textContent='Password min 4 chars.'; msg.style.color='var(--red)'; msg.classList.remove('hidden'); return; }
  if (USERS[u]||Object.keys(USERS).find(k=>k.toLowerCase()===u.toLowerCase())) { msg.textContent='Username already exists.'; msg.style.color='var(--red)'; msg.classList.remove('hidden'); return; }
  const { hash, salt } = await hashPassword(p);
  const newUser = { username:u, passwordHash:hash, salt, role:'player', createdAt:Date.now() };
  await fsSet(`users/${u}`, newUser);
  USERS[u] = newUser;
  document.getElementById('newUser').value=''; document.getElementById('newPass').value='';
  msg.textContent=`✓ User "${u}" created!`; msg.style.color='var(--green)'; msg.classList.remove('hidden');
  setTimeout(()=>{ msg.classList.add('hidden'); renderAdmin(); }, 2000);
};

window.adminResetPwd = async function(username) {
  const np = prompt(`Set new password for "${username}" (min 4 chars):`);
  if (!np) return;
  if (np.length<4) { alert('Password too short (min 4 characters).'); return; }
  const { hash, salt } = await hashPassword(np);
  await fsSet(`users/${username}`, { passwordHash:hash, salt });
  if (USERS[username]) { USERS[username].passwordHash=hash; USERS[username].salt=salt; }
  alert(`✓ Password for "${username}" has been updated.`);
};

window.deleteUser = async function(username) {
  if (!confirm(`Delete "${username}"? All their predictions will be removed.`)) return;
  await Promise.all([
    fsDelete(`users/${username}`),
    fsDelete(`predictions/${username}`),
    fsDelete(`trophyPicks/${username}`),
  ]);
  delete USERS[username]; delete PREDICTIONS[username]; delete TROPHY_PICKS[username];
  renderAdmin();
};

window.changeAdminPwd = async function() {
  const p = document.getElementById('adminPwd').value.trim();
  const msg = document.getElementById('pwdMsg');
  if (!p||p.length<4) { msg.textContent='Min 4 characters.'; msg.style.color='var(--red)'; msg.classList.remove('hidden'); return; }
  const { hash, salt } = await hashPassword(p);
  await fsSet(`users/${ADMIN_USER}`, { passwordHash:hash, salt });
  if (CU) { CU.passwordHash=hash; CU.salt=salt; }
  if (USERS[ADMIN_USER]) { USERS[ADMIN_USER].passwordHash=hash; USERS[ADMIN_USER].salt=salt; }
  msg.textContent='✓ Password updated & re-hashed.'; msg.style.color='var(--green)'; msg.classList.remove('hidden');
  document.getElementById('adminPwd').value='';
  setTimeout(()=>msg.classList.add('hidden'), 3000);
};

window.saveTrophyResults = async function() {
  const scorer = document.getElementById('trScorer').value;
  const winner = document.getElementById('trWinner').value;
  const mvp = document.getElementById('trMVP').value;
  const msg = document.getElementById('trMsg');
  if (!scorer || !winner || !mvp) { msg.textContent='Please select all three results.'; msg.style.color='var(--red)'; msg.classList.remove('hidden'); return; }
  await fsSet('config/trophyResults', { topScorer: scorer, winner, mvp, setAt: Date.now() });
  TROPHY_RESULTS = { topScorer: scorer, winner, mvp };
  msg.textContent = '✓ Trophy results saved! Points updated for all users.'; msg.style.color='var(--green)'; msg.classList.remove('hidden');
  setTimeout(() => { msg.classList.add('hidden'); renderLeaderboard(); }, 3000);
};

window.saveTrophyResults = async function() {
  const scorer = document.getElementById('trScorer').value;
  const winner = document.getElementById('trWinner').value;
  const mvp = document.getElementById('trMVP').value;
  const msg = document.getElementById('trMsg');
  if (!scorer || !winner || !mvp) {
    msg.textContent = 'Please select all three results.';
    msg.style.color = 'var(--red)'; msg.classList.remove('hidden'); return;
  }
  await fsSet('config/trophyResults', { topScorer: scorer, winner, mvp, setAt: Date.now() });
  TROPHY_RESULTS = { topScorer: scorer, winner, mvp };
  msg.textContent = '✓ Trophy results saved! Bonus points awarded automatically.';
  msg.style.color = 'var(--green)'; msg.classList.remove('hidden');
  setTimeout(() => { msg.classList.add('hidden'); renderAdmin(); }, 3000);
};

window.resetAll = async function() {
  if (!confirm('Reset ALL predictions and results? This cannot be undone.')) return;
  const predSnap = await getDocs(collection(db,'predictions'));
  const matchSnap = await getDocs(collection(db,'matches'));
  await Promise.all([
    ...predSnap.docs.map(d=>deleteDoc(d.ref)),
    ...matchSnap.docs.map(d=>deleteDoc(d.ref)),
  ]);
  PREDICTIONS = {}; MATCHES = [...makeGroupMatches(),...makeKnockoutMatches()];
  renderAdmin(); alert('All data reset.');
};

// ── Events ────────────────────────────────────────────────
document.getElementById('detailModal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('loginUser').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('regPass2').addEventListener('keydown',e=>{if(e.key==='Enter')doRegister()});
</script>
